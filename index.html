<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wheel of Death — On-Call Selector</title>
<meta name="description" content="The Wheel of Death decides who is on call for the sprint. Enter the names. Spin. Accept your fate." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Metal+Mania&family=Cinzel:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --blood: #8a0303;
    --blood-bright: #c40d0d;
    --ash: #1a1a1a;
    --bone: #d8cfc0;
    --smoke: #6b6b6b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000;
    color: var(--bone);
    font-family: 'Cinzel', serif;
    overflow-x: hidden;
  }

  /* Ominous animated fog/vignette */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 20%, rgba(138, 3, 3, 0.18), transparent 55%),
      radial-gradient(circle at 50% 120%, rgba(60, 0, 0, 0.5), transparent 60%),
      #000;
    z-index: -2;
  }
  body::after {
    content: "";
    position: fixed;
    inset: -50%;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.85) 70%);
    z-index: -1;
    animation: drift 18s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes drift {
    from { transform: translate(-4%, -3%) scale(1.05); }
    to   { transform: translate(4%, 3%) scale(1.15); }
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 0.5rem;
  }

  h1 {
    font-family: 'Pirata One', 'Metal Mania', serif;
    font-size: clamp(2.8rem, 9vw, 6rem);
    margin: 0;
    line-height: 0.95;
    color: var(--blood-bright);
    text-shadow:
      0 0 8px rgba(196, 13, 13, 0.7),
      0 0 24px rgba(138, 3, 3, 0.55),
      0 3px 4px #000;
    letter-spacing: 2px;
    animation: flicker 5s infinite;
  }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.7; }
    94% { opacity: 1; }
    96% { opacity: 0.6; }
    97% { opacity: 1; }
  }

  .subtitle {
    font-family: 'Metal Mania', cursive;
    font-size: clamp(0.9rem, 3vw, 1.3rem);
    color: var(--smoke);
    margin-top: 0.5rem;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  main {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 2.5rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }

  /* ---- Controls panel ---- */
  .panel {
    flex: 1 1 320px;
    max-width: 420px;
    background: linear-gradient(180deg, rgba(20,20,20,0.9), rgba(5,5,5,0.95));
    border: 1px solid #2a2a2a;
    border-top: 2px solid var(--blood);
    border-radius: 6px;
    padding: 1.5rem;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.6);
  }

  label {
    display: block;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 0.6rem;
    color: var(--bone);
    text-transform: uppercase;
    font-size: 0.85rem;
  }

  textarea {
    width: 100%;
    min-height: 200px;
    resize: vertical;
    background: #0c0c0c;
    color: var(--bone);
    border: 1px solid #333;
    border-radius: 4px;
    padding: 0.75rem;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    line-height: 1.6;
  }
  textarea:focus {
    outline: none;
    border-color: var(--blood);
    box-shadow: 0 0 10px rgba(138,3,3,0.6);
  }

  .hint {
    font-size: 0.75rem;
    color: var(--smoke);
    margin: 0.5rem 0 1.2rem;
    font-family: 'Cinzel', serif;
  }

  .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

  button {
    font-family: 'Pirata One', serif;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    padding: 0.7rem 1.4rem;
    font-size: 1.25rem;
    letter-spacing: 1px;
    transition: transform 0.08s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  button:active { transform: translateY(2px); }

  .spin-btn {
    flex: 1 1 auto;
    color: #fff;
    background: linear-gradient(180deg, var(--blood-bright), var(--blood));
    box-shadow: 0 0 18px rgba(196,13,13,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
    text-shadow: 0 1px 2px #000;
  }
  .spin-btn:hover:not(:disabled) { box-shadow: 0 0 28px rgba(196,13,13,0.9); }
  .spin-btn:disabled { filter: grayscale(0.7) brightness(0.6); cursor: not-allowed; }

  .ghost-btn {
    background: #181818;
    color: var(--smoke);
    border: 1px solid #333;
  }
  .ghost-btn:hover { color: var(--bone); border-color: var(--blood); }

  .mute-toggle {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: var(--smoke);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    user-select: none;
  }
  .mute-toggle input { accent-color: var(--blood); }

  /* ---- Wheel ---- */
  .stage {
    flex: 1 1 420px;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wheel-wrap {
    position: relative;
    width: min(90vw, 480px);
    aspect-ratio: 1;
  }

  /* The skull/pointer at the top */
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3rem;
    z-index: 5;
    filter: drop-shadow(0 0 6px rgba(196,13,13,0.9));
    line-height: 1;
  }
  .pointer::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 2.4rem;
    transform: translateX(-50%);
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 26px solid var(--blood-bright);
    filter: drop-shadow(0 0 4px rgba(196,13,13,0.8));
  }

  canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow:
      0 0 0 8px #111,
      0 0 0 12px var(--blood),
      0 0 40px rgba(196,13,13,0.5),
      0 0 80px rgba(0,0,0,0.9);
    background: #000;
  }

  .verdict {
    margin-top: 1.75rem;
    text-align: center;
    min-height: 4rem;
  }
  .verdict .chosen {
    font-family: 'Pirata One', serif;
    font-size: clamp(1.8rem, 6vw, 3rem);
    color: var(--blood-bright);
    text-shadow: 0 0 16px rgba(196,13,13,0.8), 0 2px 3px #000;
    margin: 0;
    animation: rise 0.6s ease;
  }
  .verdict .tagline {
    font-family: 'Metal Mania', cursive;
    color: var(--smoke);
    letter-spacing: 2px;
    margin-top: 0.25rem;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  footer {
    text-align: center;
    color: #444;
    font-size: 0.75rem;
    padding: 1rem 1rem 2rem;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
  }
  footer span { color: var(--blood); }
</style>
</head>
<body>
  <header>
    <h1>Wheel&nbsp;of&nbsp;Death</h1>
    <div class="subtitle">— who shall be on call this sprint —</div>
  </header>

  <main>
    <section class="panel" aria-label="Controls">
      <label for="names">The Names of the Damned</label>
      <textarea id="names" spellcheck="false" placeholder="Ozzy&#10;Tony&#10;Geezer&#10;Bill"></textarea>
      <p class="hint">One name per line (or separated by commas).</p>

      <div class="btn-row">
        <button class="spin-btn" id="spin">Spin the Wheel</button>
        <button class="ghost-btn" id="shuffle" title="Shuffle the order">⚰ Shuffle</button>
      </div>

      <label class="mute-toggle">
        <input type="checkbox" id="sound" checked />
        Toll the bell
      </label>
    </section>

    <section class="stage">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true">💀</div>
        <canvas id="wheel" width="900" height="900"></canvas>
      </div>
      <div class="verdict" aria-live="polite" id="verdict"></div>
    </section>
  </main>

  <footer>
    Forged in the fires of the sprint &nbsp;·&nbsp; <span>spin responsibly</span>
  </footer>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const namesInput = document.getElementById("names");
  const spinBtn = document.getElementById("spin");
  const shuffleBtn = document.getElementById("shuffle");
  const soundToggle = document.getElementById("sound");
  const verdict = document.getElementById("verdict");

  const SIZE = canvas.width;          // logical pixel size (square)
  const CENTER = SIZE / 2;
  const RADIUS = CENTER - 10;

  // Black Sabbath palette: ash, blood, char.
  const COLORS = [
    "#7a0202", "#141414", "#a40909", "#202020",
    "#5c0101", "#0d0d0d", "#8a0303", "#2a2a2a"
  ];

  let names = [];
  let rotation = 0;        // current rotation in radians
  let spinning = false;

  // ---- Name parsing ----
  function parseNames() {
    return namesInput.value
      .split(/[\n,]+/)
      .map(s => s.trim())
      .filter(Boolean);
  }

  // ---- Drawing ----
  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    if (names.length === 0) {
      ctx.save();
      ctx.translate(CENTER, CENTER);
      ctx.beginPath();
      ctx.arc(0, 0, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = "#0a0a0a";
      ctx.fill();
      ctx.fillStyle = "#555";
      ctx.font = "italic 40px Cinzel, serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Enter the names", 0, -16);
      ctx.fillText("of the damned…", 0, 32);
      ctx.restore();
      return;
    }

    const n = names.length;
    const arc = (Math.PI * 2) / n;

    ctx.save();
    ctx.translate(CENTER, CENTER);
    ctx.rotate(rotation);

    for (let i = 0; i < n; i++) {
      const start = i * arc;
      const end = start + arc;

      // Wedge
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, RADIUS, start, end);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.stroke();

      // Name text
      ctx.save();
      ctx.rotate(start + arc / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#e7ddcc";
      ctx.shadowColor = "rgba(0,0,0,0.9)";
      ctx.shadowBlur = 4;
      const fontSize = Math.max(20, Math.min(46, 360 / Math.max(names.length, 6)));
      ctx.font = `700 ${fontSize}px Cinzel, serif`;
      const label = names[i].length > 18 ? names[i].slice(0, 17) + "…" : names[i];
      ctx.fillText(label, RADIUS - 24, 0);
      ctx.restore();
    }

    // Hub
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS * 0.12, 0, Math.PI * 2);
    ctx.fillStyle = "#111";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#a40909";
    ctx.stroke();
    ctx.fillStyle = "#a40909";
    ctx.font = "28px 'Pirata One', serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("✞", 0, 1);

    ctx.restore();
  }

  // ---- Determine winner under the pointer (top = -90°) ----
  function winnerIndex() {
    const n = names.length;
    const arc = (Math.PI * 2) / n;
    // Pointer sits at the top, which is angle -PI/2 in canvas coords.
    // A segment i covers [i*arc, (i+1)*arc) after applying `rotation`.
    // Solve for which segment lands under the pointer.
    const pointer = -Math.PI / 2;
    let theta = (pointer - rotation) % (Math.PI * 2);
    if (theta < 0) theta += Math.PI * 2;
    return Math.floor(theta / arc) % n;
  }

  // ---- Spin animation ----
  function spin() {
    if (spinning) return;
    names = parseNames();
    if (names.length < 2) {
      flashVerdict("Need at least two souls.", "");
      draw();
      return;
    }

    spinning = true;
    spinBtn.disabled = true;
    verdict.innerHTML = "";

    const duration = 5200 + Math.random() * 1200;
    const start = rotation;
    const turns = 6 + Math.floor(Math.random() * 4);          // full rotations
    const target = start + turns * Math.PI * 2 + Math.random() * Math.PI * 2;
    const t0 = performance.now();

    tickBell(); // opening toll

    function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

    function frame(now) {
      const elapsed = now - t0;
      const t = Math.min(elapsed / duration, 1);
      rotation = start + (target - start) * easeOutQuart(t);
      draw();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        spinBtn.disabled = false;
        announce();
      }
    }
    requestAnimationFrame(frame);
  }

  function announce() {
    const chosen = names[winnerIndex()];
    const taglines = [
      "has been chosen to bear the pager.",
      "shall answer the midnight call.",
      "is bound to the on-call rotation.",
      "your fate is sealed.",
      "the wheel has spoken."
    ];
    const tag = taglines[Math.floor(Math.random() * taglines.length)];
    verdict.innerHTML =
      '<p class="chosen">' + escapeHtml(chosen) + "</p>" +
      '<p class="tagline">' + tag + "</p>";
    tollFinal();
  }

  function flashVerdict(main, tag) {
    verdict.innerHTML =
      '<p class="chosen">' + escapeHtml(main) + "</p>" +
      (tag ? '<p class="tagline">' + tag + "</p>" : "");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ---- Audio: a tolling bell (Black Sabbath's opening) via WebAudio ----
  let audioCtx = null;
  function ac() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }

  function bellStrike(time, baseFreq, gainVal) {
    const c = ac();
    if (!c) return;
    // A few inharmonic partials make a passable bell.
    const partials = [1, 2.0, 2.4, 3.0, 4.5];
    const master = c.createGain();
    master.gain.setValueAtTime(gainVal, time);
    master.gain.exponentialRampToValueAtTime(0.0001, time + 3.2);
    master.connect(c.destination);

    partials.forEach((p, i) => {
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = "sine";
      osc.frequency.value = baseFreq * p;
      const amp = 1 / (i + 1);
      g.gain.setValueAtTime(amp, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 2.6 - i * 0.3);
      osc.connect(g);
      g.connect(master);
      osc.start(time);
      osc.stop(time + 3.2);
    });
  }

  function tickBell() {
    if (!soundToggle.checked) return;
    const c = ac();
    if (!c) return;
    if (c.state === "suspended") c.resume();
    bellStrike(c.currentTime, 220, 0.5);
  }

  function tollFinal() {
    if (!soundToggle.checked) return;
    const c = ac();
    if (!c) return;
    if (c.state === "suspended") c.resume();
    // Doom: three slow tolls.
    bellStrike(c.currentTime, 160, 0.6);
    bellStrike(c.currentTime + 0.9, 160, 0.6);
    bellStrike(c.currentTime + 1.8, 110, 0.7);
  }

  // ---- Shuffle ----
  function shuffle() {
    names = parseNames();
    for (let i = names.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [names[i], names[j]] = [names[j], names[i]];
    }
    namesInput.value = names.join("\n");
    rotation = 0;
    draw();
  }

  // ---- Persistence ----
  const STORAGE_KEY = "wheel-of-death-names";
  function saveNames() {
    try { localStorage.setItem(STORAGE_KEY, namesInput.value); } catch (e) {}
  }
  function loadNames() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) namesInput.value = saved;
    } catch (e) {}
  }

  // ---- Wire up ----
  spinBtn.addEventListener("click", spin);
  shuffleBtn.addEventListener("click", shuffle);
  namesInput.addEventListener("input", () => {
    names = parseNames();
    saveNames();
    draw();
  });

  // Seed
  loadNames();
  if (!namesInput.value.trim()) {
    namesInput.value = "Ozzy\nTony\nGeezer\nBill";
  }
  names = parseNames();
  draw();
})();
</script>
</body>
</html>
